version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ticketsecure-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: ticketsecure_db
    ports:
      - "5444:5432"
    volumes:
      - ticketsecure_data:/var/lib/postgresql/data

volumes:
  ticketsecure_data: