name: CI TicketSecure - Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: ticketsecure_db
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ticketsecure_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Fazer o checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: ticketsecure/pom.xml

    - name: Compilar e Rodar os Testes
      working-directory: ticketsecure
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5444/ticketsecure_db
        SPRING_DATASOURCE_USERNAME: admin
        SPRING_DATASOURCE_PASSWORD: adminpassword
        JWT_SECRET: ci-test-secret-key-for-jwt-signing-must-be-long-enough-for-hs256
        TICKETSECURE_SECURITY_KEY: ci-test-salt
        CORS_ALLOWED_ORIGINS: "*"
        GROQ_API_KEY: ""
        OPENROUTER_API_KEY: ""
      run: mvn -B package -Dspring.profiles.active=ci
