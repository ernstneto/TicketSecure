# Perfil CI - usado pelo GitHub Actions com PostgreSQL service container
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5444/ticketsecure_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminpassword}

jwt.secret=${JWT_SECRET:ci-test-secret-key-for-jwt-signing-must-be-long-enough}
jwt.expiration=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.rabbitmq.listener.simple.auto-startup=false

ticketsecure.security.qr-salt=${TICKETSECURE_SECURITY_KEY:ci-test-salt}

llm.groq.key=${GROQ_API_KEY:}
llm.openrouter.key=${OPENROUTER_API_KEY:}
