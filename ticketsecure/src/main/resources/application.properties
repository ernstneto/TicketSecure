spring.application.name=TicketSecure

spring.datasource.url=jdbc:postgresql://localhost:5444/ticketsecure_db
spring.datasource.username=admin
spring.datasource.password=adminpassword

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.template.receive-timeout=5000

# Segredo Criptográfico para geração dos Ingressos (QR Code)
ticketsecure.security.qr-salt=TicketSecure@SuperSecretSalt2026!