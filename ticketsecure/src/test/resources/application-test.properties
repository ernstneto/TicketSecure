# Configuração específica para testes de integração
# Use as mesmas chaves do application.properties, mas com suporte a variáveis de ambiente

spring.application.name=TicketSecure

# Banco de dados - usar H2 em memória para testes (mais rápido)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# RabbitMQ — não falhar testes se broker estiver offline
spring.rabbitmq.listener.simple.auto-startup=false

# ==========================================
# 🤖 INTEGRAÇÃO IA (Groq & OpenRouter)
# ==========================================
# Variáveis de ambiente têm prioridade sobre valores padrão
llm.groq.url=https://api.groq.com/openai/v1/chat/completions
llm.groq.key=${GROQ_API_KEY:}

llm.openrouter.url=https://openrouter.ai/api/v1/chat/completions
llm.openrouter.key=${OPENROUTER_API_KEY}
llm.openrouter.model=nvidia/nemotron-3-super-120b-a12b:free

# Timeout maior para chamadas de IA
server.servlet.session.timeout=30s
